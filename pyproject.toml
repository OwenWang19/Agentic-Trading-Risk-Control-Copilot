[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-trading-risk-control-copilot"
version = "0.1.0"
description = "A reproducible AI-agent-style workflow for trading risk monitoring, reconciliation, and control-gap investigation."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Jiashu Wang" }]
dependencies = []

[project.scripts]
trading-risk-copilot = "agentic_trading_risk_copilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
